<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KerjaBro - Sign In</title>

    <link rel="stylesheet" href="Login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <div class="left">
            <img src="../assets/image/LoginIlustrasi.png" class="illustration" alt="Login Illustration">
        </div>

        <div class="right">
            <div class="logo">
                <img src="../assets/iconOrlogo/LogoKerjaBro.png" alt="KerjaBro Logo">
                <h1>KerjaBro<span>.</span></h1>
            </div>

            <div class="form-box">
                <h2>Sign In</h2>
                <p>Selamat datang kembali bro, silakan<br>masuk yaa!</p>

                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="Email" id="email">
                </div>
                <small id="emailError" class="error"></small>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password" id="password">
                </div>
                <small id="passwordError" class="error"></small>

                <a href="#" class="forgot">Forgot password?</a>

                <button type="button" onclick="login()">Masuk</button>

                <div class="divider">
                    <span></span>
                    <p>Or login with</p>
                    <span></span>
                </div>

                <button type="button" class="google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                    Google
                </button>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
</body>

</html>
